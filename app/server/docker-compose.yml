name: city-explorer-lab5
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-city_explorer}
      MARIADB_USER: ${DB_USER:-web}
      MARIADB_PASSWORD: ${DB_PASSWORD:-web}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - date:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  date:
